name: Build and Release GUI

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller torch soundfile sounddevice qwen-tts openai-whisper

      - name: Build executable
        run: |
          pyinstaller --noconfirm --onefile --windowed `
            --add-data "data\voices;data/voices" `
            --add-data "data\outputs;data/outputs" `
            gui.py
        shell: powershell

      - name: Install GitHub CLI
        run: |
          winget install --id GitHub.cli -e --silent
        shell: powershell

      - name: Create Release
        run: |
          gh release create v${{ github.run_number }} dist/gui.exe \
            --title "Release v${{ github.run_number }}" \
            --notes "Automated release from GitHub Actions."
        env:
          GH_TOKEN: ${{ secrets.REPO_PAT }}
        shell: powershell

      - name: Upload Release Asset
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: dist/gui.exe
          asset_name: gui.exe
          asset_content_type: application/octet-stream
