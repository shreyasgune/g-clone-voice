name: Build and Release g-clone-voice

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    outputs:
      artifact-path: dist/app.exe
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller torch soundfile sounddevice qwen-tts openai-whisper huggingface-hub

      - name: Build Windows executable
        run: |
          pyinstaller --noconfirm --onefile --windowed `
            --add-data "data\voices;data/voices" `
            --add-data "data\outputs;data/outputs" `
            --add-data "assets;whisper/assets" `
            --add-data "models;models" `
          app.py   
        shell: powershell

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: gui-windows
          path: dist/app.exe

  build-macos:
    runs-on: macos-latest
    outputs:
      artifact-path: dist/app.app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller torch soundfile sounddevice qwen-tts openai-whisper huggingface-hub

      - name: Build macOS executable
        run: |
          pyinstaller --noconfirm --onefile --windowed \
            --add-data "data/voices:data/voices" \
            --add-data "data/outputs:data/outputs" \
            --add-data "assets:whisper/assets" \
            --add-data "models:models" \
          app.py

      - name: Zip macOS app
        run: |
          cd dist
          zip -r app-macos.zip app.app

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: gui-macos
          path: dist/app-macos.zip

  create-release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: gui-windows
          path: release/

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: gui-macos
          path: release/

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        with:
          tag_name: "v${{ github.run_number }}"
          release_name: "Release v${{ github.run_number }}"
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.REPO_PAT }}

      - name: Upload Release Assets
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.REPO_PAT }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: release/app.exe
          asset_name: app-windows.exe
          asset_content_type: application/octet-stream

      - name: Upload Release Assets (macOS)
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.REPO_PAT }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: release/app.app
          asset_name: app-macos.app
          asset_content_type: application/octet-stream
