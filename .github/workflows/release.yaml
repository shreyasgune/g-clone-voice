name: Build and Release g-clone-voice

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller torch soundfile sounddevice qwen-tts openai-whisper huggingface-hub

      - name: Build Windows executable
        run: |
          pyinstaller --noconfirm --onefile --windowed `
            --add-data "data\voices;data/voices" `
            --add-data "data\outputs;data/outputs" `
            --add-data "assets;whisper/assets" `
            --add-data "models;models" `
          app.py   
        shell: powershell

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: gui-windows
          path: dist/app.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller torch soundfile sounddevice qwen-tts openai-whisper huggingface-hub

      - name: Build macOS executable
        run: |
          pyinstaller --noconfirm --onefile --windowed \
            --add-data "data/voices:data/voices" \
            --add-data "data/outputs:data/outputs" \
            --add-data "assets:whisper/assets" \
            --add-data "models:models" \
          app.py

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: gui-macos
          path: dist/app.app